<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Loading</title>
    <style>
      html,
      body {
        margin: 0;
        background-color: black;
        /* no pull-to-refresh or swipe back/forward over the game */
        overscroll-behavior: none;
      }
      .backbuffer {
        /* touches are the game's, not the browser's (scroll, zoom, swipe) */
        touch-action: none;
        position: absolute;
        top: 0px;
        left: 0px;
        margin: 0px;
        border: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: block;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
      .title {
        pointer-events: none;
        position: absolute;
        top: 10px;
        margin-top: 0px;
        padding-left: 10px;
        color: white;
        text-decoration: none;
        z-index: 1;
        text-align: left;
        font-family: "Roboto", Helvetica, sans-serif;
        font-size: 20px;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      #start {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        font-size: 2rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="title" id="title-text"></div>
    <button id="start" onclick="startGame()">Start</button>
    <canvas
      class="backbuffer"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <script type="text/javascript">
      // The on-screen keyboard for touch screens (ot-client#95).
      //
      // Phone browsers open their keyboard only when a text input is focused
      // inside the tap itself. The engine runs in a worker and sees the tap
      // too late, so it tells this page where its editable text fields are
      // (window.otTextInputs, from UIManager::publishTextInputs). A tap on
      // one focuses the hidden input below; what is typed into it goes to the
      // engine as key events, and the input is emptied again.
      (function () {
        var input = document.createElement("input");
        input.id = "touch-text-input";
        input.setAttribute("autocomplete", "off");
        input.setAttribute("autocapitalize", "off");
        input.setAttribute("autocorrect", "off");
        input.setAttribute("spellcheck", "false");
        input.setAttribute("enterkeyhint", "done");
        input.setAttribute("aria-hidden", "true");
        // 16px: iOS zooms into inputs with smaller text
        input.style.cssText =
          "position:fixed;left:0;top:0;width:2px;height:2px;padding:0;margin:0;border:0;" +
          "opacity:0;font-size:16px;pointer-events:none;z-index:0;";

        // The input keeps one character, so that Backspace on an "empty"
        // field still changes it (and arrives as an input event).
        var SENTINEL = " ";
        var last = SENTINEL;
        var composing = false;
        var focusedAt = 0;
        var touchStart = null;
        var engineFocused = false;
        // The focused field is multi-line (a letter, a book): its Enter key
        // starts a new line and is labelled as such ("return"), instead of
        // "Done" (which did nothing visible there). Elsewhere it's "Done" and
        // submits. The keyboard closes with the system's hide-keyboard
        // button, a tap outside the field, or the window's own buttons.
        var multiline = false;
        function setMultiline(on) {
          multiline = on;
          var hint = on ? "enter" : "done";
          if (input.getAttribute("enterkeyhint") !== hint) input.setAttribute("enterkeyhint", hint);
        }

        function reset() {
          input.value = SENTINEL;
          last = SENTINEL;
          try {
            input.setSelectionRange(SENTINEL.length, SENTINEL.length);
          } catch (e) {}
        }
        function sendKey(type, key, code) {
          window.dispatchEvent(new KeyboardEvent(type, { key: key, code: code || "", bubbles: true, cancelable: true }));
        }
        function press(key) {
          sendKey("keydown", key, key);
          if (key === "Enter") sendKey("keypress", key, key);
          sendKey("keyup", key, key);
        }
        function typeText(text) {
          Array.from(text).forEach(function (ch) {
            sendKey("keypress", ch);
          });
        }
        function setHidden(hidden) {
          var type = hidden ? "password" : "text";
          if (input.type !== type) {
            input.type = type;
            reset();
          }
        }

        input.addEventListener("compositionstart", function () {
          composing = true;
        });
        input.addEventListener("compositionend", function () {
          composing = false;
        });
        input.addEventListener("input", function (ev) {
          var value = input.value;
          if (ev.inputType === "insertFromPaste") {
            // pasting already goes to the engine through the page's paste handler
            reset();
            return;
          }
          // what changed since last time: characters removed at the end,
          // then characters added (also covers keyboards that rewrite a word)
          var same = 0;
          while (same < last.length && same < value.length && last[same] === value[same]) same++;
          for (var i = same; i < last.length; i++) press("Backspace");
          typeText(value.slice(same));
          last = value;
          if (!composing && (value.length === 0 || value.length > 64 || value.indexOf(SENTINEL) !== 0)) reset();
        });

        // Real key events from the input (hardware keyboards, and phones that
        // send them): text and Backspace already come from the input event
        // above, so they stop here, before the engine's own listeners. Enter
        // is sent once. Other keys (arrows, Tab, Escape, shortcuts) go on to
        // the engine as before.
        ["keydown", "keypress", "keyup"].forEach(function (type) {
          window.addEventListener(type, function (ev) {
            if (ev.target !== input || ev.ctrlKey || ev.metaKey || ev.altKey) return;
            var key = ev.key || "";
            if (key === "Enter" || ev.keyCode === 13) {
              ev.stopImmediatePropagation();
              ev.preventDefault();
              if (type === "keydown") press("Enter");
              return;
            }
            if (key.length > 1 && key !== "Backspace" && key !== "Unidentified" && key !== "Process" && key !== "Dead") return;
            ev.stopImmediatePropagation();
          }, true);
        });

        function fieldAt(clientX, clientY) {
          var data = window.otTextInputs;
          var canvas = document.getElementById("canvas");
          if (!data || !data.fields || !canvas) return null;
          var r = canvas.getBoundingClientRect();
          if (r.width <= 0 || r.height <= 0) return null;
          var x = (clientX - r.left) / r.width;
          var y = (clientY - r.top) / r.height;
          var hit = null;
          // later fields are drawn later (on top)
          data.fields.forEach(function (f) {
            if (x >= f[0] && x <= f[0] + f[2] && y >= f[1] && y <= f[1] + f[3]) hit = f;
          });
          return hit;
        }

        window.addEventListener("touchstart", function (ev) {
          var t = ev.changedTouches && ev.changedTouches[0];
          touchStart = t ? { x: t.clientX, y: t.clientY } : null;
        }, { capture: true, passive: true });

        window.addEventListener("touchend", function (ev) {
          var t = ev.changedTouches && ev.changedTouches[0];
          if (!t) return;
          // a drag (scrolling a list) is not a tap
          if (touchStart && Math.abs(t.clientX - touchStart.x) + Math.abs(t.clientY - touchStart.y) > 12) return;
          var field = fieldAt(t.clientX, t.clientY);
          if (field) {
            if (!input.isConnected) document.body.appendChild(input);
            setHidden(field[4] === 1);
            setMultiline(field[5] === 1);
            input.style.left = Math.max(0, Math.min(t.clientX, window.innerWidth - 4)) + "px";
            input.style.top = Math.max(0, Math.min(t.clientY, window.innerHeight - 4)) + "px";
            if (document.activeElement !== input) reset();
            input.focus({ preventScroll: true });
            focusedAt = Date.now();
            // a field the engine already focuses counts: the published state
            // only changes (and reports) when something differs, so tapping
            // a field that was focused already reports nothing new
            engineFocused = !!(window.otTextInputs && window.otTextInputs.focus);
          } else if (document.activeElement === input) {
            input.blur();
          }
        }, { capture: true, passive: true });

        // The engine's text field lost the focus (for example after Enter
        // logs in, or Done in a single-line field): close the keyboard. Only
        // once the engine has had a focused field since the tap, and not
        // right after it (the engine may not have seen the tap yet).
        window.otTextInputsChanged = function () {
          var data = window.otTextInputs || {};
          if (document.activeElement !== input) return;
          if (data.focus) {
            engineFocused = true;
            setHidden(data.focus === 2);
            setMultiline(data.multiline === 1);
          } else if (engineFocused && Date.now() - focusedAt > 800) {
            input.blur();
          }
        };

        // While the on-screen keyboard is open, the page tells the game which
        // part of the canvas is still visible above it, as fractions of the
        // canvas height (window.otclientConfig.keyboardVisibleTop/Bottom; the
        // game reads them with g_platform.getBrowserConfigString). Windows
        // with a text field move and shrink into that part, so their buttons
        // stay in reach. Nothing is set while the keyboard is closed.
        function publishKeyboard() {
          var vv = window.visualViewport;
          var canvas = document.getElementById("canvas");
          var config = (window.otclientConfig = window.otclientConfig || {});
          if (!vv || !canvas) return;
          var r = canvas.getBoundingClientRect();
          var open = document.activeElement === input && vv.height < window.innerHeight - 80 && r.height > 0;
          if (open) {
            var top = Math.max(0, Math.min(1, (vv.offsetTop - r.top) / r.height));
            var bottom = Math.max(top, Math.min(1, (vv.offsetTop + vv.height - r.top) / r.height));
            config.keyboardVisibleTop = top.toFixed(4);
            config.keyboardVisibleBottom = bottom.toFixed(4);
          } else {
            delete config.keyboardVisibleTop;
            delete config.keyboardVisibleBottom;
          }
        }
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", publishKeyboard);
          window.visualViewport.addEventListener("scroll", publishKeyboard);
        }
        input.addEventListener("focus", function () {
          setTimeout(publishKeyboard, 50);
        });
        input.addEventListener("blur", function () {
          setTimeout(publishKeyboard, 50);
        });

        document.addEventListener("DOMContentLoaded", function () {
          document.body.appendChild(input);
        });
        if (document.body) document.body.appendChild(input);
      })();

      var canvas = document.getElementById("canvas");
      function reportRuntimeError(prefix, error) {
        const payload = [prefix, error]
          .flat()
          .filter(Boolean)
          .map((entry) => {
            if (!entry) return "";
            if (typeof entry === "string") {
              return entry;
            }
            if (entry.stack) {
              return entry.stack;
            }
            try {
              return JSON.stringify(entry);
            } catch (_) {
              return String(entry);
            }
          })
          .join(": ");
        console.error(payload);
        const title = document.getElementById("title-text");
        if (title) {
          title.innerHTML = "Runtime error – check console";
        }
      }
      function startGame() {
        document.getElementById("start").style.display = "none";
        callMain();
        document.addEventListener("touchstart", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        }, { passive: false });
        document.addEventListener("touchmove", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        }, { passive: false });
        document.addEventListener("touchend", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        }, { passive: false });
        document.addEventListener("keyup", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keydown", function (ev) {
          if (
            !ev.ctrlKey &&
            ev.key !== "Enter" &&
            ev.key !== "Escape" &&
            ev.key !== "Backspace" &&
            ev.key !== "ArrowLeft" &&
            ev.key !== "ArrowRight" &&
            ev.key !== "ArrowUp" &&
            ev.key !== "ArrowDown"
          ) {
            canvas.dispatchEvent(new KeyboardEvent("keypress", ev));
          } else if (ev.ctrlKey && ev.key === "v") {
            return true;
          }
          ev.preventDefault();
          ev.stopPropagation();
        });
      }
      var Module = {
        locateFile: function (path) {
          const baseURL =
            window.location.origin +
            window.location.pathname.substring(
              0,
              window.location.pathname.lastIndexOf("/")
            );
          return baseURL + "/" + path;
        },
        preRun: [
          function () {
            addRunDependency("syncfs");
            if (!FS.analyzePath("/user").exists) FS.mkdir("/user");
            FS.mount(IDBFS, { autoPersist: true }, "/user");
            FS.syncfs(true, function (err) {
              if (err) {
                Module.print(err);
              }
              removeRunDependency("syncfs");
            });
          },
        ],
        postRun: [],
        print: (function () {
          return function (text) {
            text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);
          };
        })(),
        printErr: function () {
          reportRuntimeError("stderr", Array.prototype.slice.call(arguments).join(" "));
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          return canvas;
        })(),
        onAbort: function (reason) {
          reportRuntimeError("abort", reason || "unknown reason");
        },
        setStatus: function (text) {
          console.log("status: " + text);
          let display = "";
          if (text.includes("Running...")) {
            // Start as soon as everything is downloaded (no sound to unlock
            // with a click on 7.x servers)
            display = "Loading...";
            if (document.getElementById("start").style.display !== "none") {
              startGame();
            }
          } else if (text.includes("Downloading data...")) {
            // "Downloading data... (loaded/total)" in bytes
            const progress = text.match(/\((\d+)\/(\d+)\)/);
            display = progress
              ? "Downloading " + (progress[1] / 1048576).toFixed(1) + " of " +
                (progress[2] / 1048576).toFixed(1) + " MB"
              : "Downloading...";
          }

          document.getElementById("title-text").innerHTML = display;
        },
        monitorRunDependencies: function (left) {
          console.log("monitor run deps: " + left);
          document.getElementById("title-text").innerHTML = "Initializing...";
        },
      };
      window.onerror = function (message, source, lineno, colno, error) {
        reportRuntimeError("window.onerror", error || message);
      };
      window.addEventListener("unhandledrejection", function (event) {
        reportRuntimeError("unhandledrejection", event.reason || "Promise rejected");
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
