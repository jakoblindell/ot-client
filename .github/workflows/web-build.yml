name: Web Build

on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "UI screenshots: save this run's images as the new baseline (commits to the branch; web-client-792 does this by itself after every push)"
        type: boolean
        default: false
  push:
    branches:
      - web-client-792
    # (the baselines' own commit; it is pushed with the workflow's token,
    # which starts no workflow anyway)
    paths-ignore:
      - "tools/ui-gallery/baseline/**"
  # (built to test a change before it is merged; only pushes publish)
  pull_request:
    branches:
      - web-client-792

permissions:
  contents: read

jobs:
  build-browser:
    name: Browser Bundle
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: docker-browser-build.log
      OUTPUT_DIR: build-emscripten-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The build's id, inside the bundle (the client knows what it is) and
      # next to it as version.json (what the server offers; ot-client#32)
      - name: Stamp the build
        run: |
          # the build is when it was made (UTC), so a later build sorts after an earlier one
          BUILD="$(date -u +%Y-%m-%d-%H%M)"
          printf '{"build":"%s","commit":"%s"}\n' "$BUILD" "${GITHUB_SHA::7}" > data/build.json
          cat data/build.json

      # vcpkg's built libraries (abseil, protobuf, openal, ...): built once and
      # kept, so a build only compiles the client (ot-client#87). A new key
      # when the versions, the compiler or our triplets/ports change; older
      # caches still give every library that did not change.
      - name: Restore built libraries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'Dockerfile.browser', 'browser/triplets/**', 'browser/overlay-ports/**') }}
          restore-keys: |
            vcpkg-wasm-

      - name: Build browser bundle with Docker
        run: bash Dockerfile.browser.sh

      - name: Write version.json
        run: cp data/build.json "$OUTPUT_DIR/version.json"

      - name: Report the end of the build log
        if: failure()
        run: |
          # One annotation with the last lines of the log, readable without
          # downloading the job log
          tail -n 80 "$BUILD_LOG" | cut -c1-300 > tail.txt
          echo "::error title=Build log (last 80 lines)::$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' tail.txt | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Upload browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: otclient-browser-${{ github.sha }}
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUTPUT_DIR }}
          retention-days: 14

  # UI screenshot tests (ot-client#70): the gallery pages on phones, a tablet
  # and desktop, compared with tools/ui-gallery/baseline. On a pull request
  # the baseline is the base branch's (pull requests carry no baseline
  # images); changed pages are listed in the job summary and the report
  # artifact, and do not fail the check. It fails on a page that fails or is
  # missing, and on a doesn't-fit finding the baseline doesn't have
  # (baseline/doesnt-fit.txt). After a push to web-client-792 the run saves
  # its images and findings as the new baseline and commits them there.
  ui-gallery:
    name: UI screenshots
    needs: build-browser
    # (pinned: the baselines were made here, and Playwright 1.56 has no
    # Chromium for Ubuntu 26.04, what ubuntu-latest became)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Compared with the base branch's baseline, whatever the pull request
      # has in baseline/ (a changed image is reported, not committed)
      - name: Use the base branch's baseline
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          dir=tools/ui-gallery/baseline
          git fetch --no-tags --depth=1 origin "$BASE"
          if [ -n "$(git diff --name-only FETCH_HEAD HEAD -- "$dir")" ]; then
            echo "::warning title=UI gallery::This pull request changes $dir. Baselines are made on $BASE after the merge; drop these files from the pull request (they are not used here and conflict with other pull requests)."
          fi
          seed="$RUNNER_TEMP/doesnt-fit.txt"
          cp "$dir/doesnt-fit.txt" "$seed" 2>/dev/null || true
          rm -rf "$dir"
          git checkout FETCH_HEAD -- "$dir"
          # (until $BASE has a list of known findings: the pull request's)
          if [ ! -f "$dir/doesnt-fit.txt" ] && [ -f "$seed" ]; then cp "$seed" "$dir/doesnt-fit.txt"; fi

      - name: Download browser artifact
        uses: actions/download-artifact@v5
        with:
          name: otclient-browser-${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        working-directory: tools/ui-gallery
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Take and compare screenshots
        id: shots
        working-directory: tools/ui-gallery
        env:
          UPDATE: ${{ github.event_name == 'push' || inputs.update_baselines }}
        run: |
          if [ "$UPDATE" = "true" ]; then
            node gallery.js --bundle ../../build-emscripten-web --out ../../ui-gallery --update
          else
            node gallery.js --bundle ../../build-emscripten-web --out ../../ui-gallery
          fi

      - name: Write the job summary
        if: always()
        run: cat ui-gallery/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-gallery-${{ github.sha }}
          path: ui-gallery
          retention-days: 14

      # (also when a page failed: the others are saved, the failed one keeps
      # its old image). Pushed with the workflow's token, so the commit starts
      # no workflow: no new run, no new pre-release.
      - name: Commit the new baselines
        if: always() && (steps.shots.outcome == 'success' || steps.shots.outcome == 'failure') && (github.event_name == 'push' || inputs.update_baselines)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/ui-gallery/baseline
          if git diff --cached --quiet; then
            echo "The baseline did not change"
            exit 0
          fi
          git commit -q -m "UI gallery: new baseline images" -m "From the Web Build run of ${GITHUB_SHA::7}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # (a newer push's run saves its own baseline: this one is stale)
          head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=UI gallery::${GITHUB_REF_NAME} moved on to ${head::7}; its own run saves the baseline"
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish:
    name: Publish pre-release
    needs: build-browser
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}-latest
    steps:
      - name: Download browser artifact
        uses: actions/download-artifact@v5
        with:
          name: otclient-browser-${{ github.sha }}

      - name: Package bundle
        run: |
          cd build-emscripten-web
          zip -r ../otclient-web.zip .

      - name: Replace pre-release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" otclient-web.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Web client (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Browser build of ${GITHUB_SHA} (${GITHUB_REF_NAME}). Game assets (Tibia.dat/Tibia.spr) are not included."
