name: Web Build

on:
  workflow_dispatch:
  push:
    branches:
      - web-client-792
  # (built to test a change before it is merged; only pushes publish)
  pull_request:
    branches:
      - web-client-792

permissions:
  contents: read

jobs:
  build-browser:
    name: Browser Bundle
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: docker-browser-build.log
      OUTPUT_DIR: build-emscripten-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The build's id, inside the bundle (the client knows what it is) and
      # next to it as version.json (what the server offers; ot-client#32)
      - name: Stamp the build
        run: |
          # the build is when it was made (UTC), so a later build sorts after an earlier one
          BUILD="$(date -u +%Y-%m-%d-%H%M)"
          printf '{"build":"%s","commit":"%s"}\n' "$BUILD" "${GITHUB_SHA::7}" > data/build.json
          cat data/build.json

      - name: Build browser bundle with Docker
        run: bash Dockerfile.browser.sh

      - name: Write version.json
        run: cp data/build.json "$OUTPUT_DIR/version.json"

      - name: Report the end of the build log
        if: failure()
        run: |
          # One annotation with the last lines of the log, readable without
          # downloading the job log
          tail -n 80 "$BUILD_LOG" | cut -c1-300 > tail.txt
          echo "::error title=Build log (last 80 lines)::$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' tail.txt | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Upload browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: otclient-browser-${{ github.sha }}
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUTPUT_DIR }}
          retention-days: 14

  publish:
    name: Publish pre-release
    needs: build-browser
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}-latest
    steps:
      - name: Download browser artifact
        uses: actions/download-artifact@v5
        with:
          name: otclient-browser-${{ github.sha }}

      - name: Package bundle
        run: |
          cd build-emscripten-web
          zip -r ../otclient-web.zip .

      - name: Replace pre-release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" otclient-web.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Web client (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Browser build of ${GITHUB_SHA} (${GITHUB_REF_NAME}). Game assets (Tibia.dat/Tibia.spr) are not included."
