name: Web Build

# TEMPORARY test branch (not for merging): runs the context loss and input
# tests on a bundle another run built.
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "unused"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  BUNDLE_RUN: "45850267690"
  BUNDLE_SHA: "17510bb"

jobs:
  ctx-test:
    name: Context loss and input test (temporary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Find the bundle artifact
        id: art
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api "repos/${{ github.repository }}/actions/runs/${BUNDLE_RUN}/artifacts" --jq '.artifacts[]|select(.name|startswith("otclient-browser-"))|.name')
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.art.outputs.name }}
          run-id: ${{ env.BUNDLE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tools/ui-gallery
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests
        working-directory: tools/ctx-test
        env:
          PW_MODULE: ${{ github.workspace }}/tools/ui-gallery/node_modules/playwright
        run: |
          mkdir -p out
          export OUT=out
          rc=0
          if [ "${TESTS:-ctx}" != ctx ]; then node input-mix.js ../../build-emscripten-web || rc=1; fi
          node context-loss.js ../../build-emscripten-web --print || rc=1
          node context-loss.js ../../build-emscripten-web map --print || rc=1
          for p in hotbar outfit; do node context-loss.js ../../build-emscripten-web $p || rc=1; done
          exit $rc
